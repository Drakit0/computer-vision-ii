[project]
name = "cv-lab-gan"
version = "0.1.0"
description = "Lab 5 - Session I"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=25.1.0",
    "flake8>=7.3.0",
    "gdown>=5.2.0",
    "h5py>=3.14.0",
    "matplotlib>=3.10.6",
    "mypy>=1.17.1",
    "numpy>=2.3.2",
    "pytest>=8.4.1",
    "pytest-cov>=6.0.0",
    "scikit-learn>=1.7.1",
    "torch>=2.8.0",
    "torchvision==0.23.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gan*"]
exclude = ["images*"]

[tool.mypy]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
ignore = ["E731", "E203"]

[tool.pylint."MESSAGES CONTROL"]

[tool.pytest.ini_options]
pythonpath = [".", "gan"]
markers = [
    "run: mark the order of the test.",
    "order: mark the order of test execution."
]
addopts = "--cov gan/src"

[tool.coverage.run]
omit = ["gan/src/main.py"]


# Download torch without CUDA [Default]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
